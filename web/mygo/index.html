<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Lobe MyGo preview</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; background: transparent; }
      body {
        display: flex; align-items: center; justify-content: center;
        font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #8e8e93;
      }
      .spinner {
        width: 18px; height: 18px; border-radius: 50%;
        border: 1.5px solid currentColor; border-top-color: transparent;
        animation: spin 0.6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error { max-width: 80%; text-align: center; }
    </style>
  </head>
  <body>
    <div class="spinner" role="progressbar" aria-label="Loading the preview"></div>
    <script>
      // A frame's prefers-color-scheme follows the browser, not the docs page, so the page's
      // data-theme (docs-kit) is mirrored into data-mygo-theme, which MyGo follows live.
      try {
        const page = parent !== window && parent.document.documentElement
        if (page) {
          const sync = () => (document.documentElement.dataset.mygoTheme = page.dataset.theme === "dark" ? "dark" : "light")
          sync()
          new MutationObserver(sync).observe(page, { attributes: true, attributeFilter: ["data-theme"] })
        }
      } catch {}
    </script>
    <script src="/mygo/wasm_exec.js"></script>
    <script>
      const wasm = __WASM__
      const dev = __DEV__
      const params = new URLSearchParams(location.search)
      const demo = params.get("demo") || ""
      if (params.get("scroll") !== "1") {
        // MyGo's canvas cancels every wheel event, which traps the docs page's scrolling over
        // demos with nothing to scroll; stopping it before the canvas lets the browser chain the
        // scroll to the page.
        addEventListener("wheel", (e) => e.stopImmediatePropagation(), { capture: true, passive: true })
      }
      const go = new Go()
      go.argv = ["catalog", demo]
      const showError = (text) => {
        const p = document.createElement("p")
        p.className = "error"
        p.textContent = text
        document.body.replaceChildren(p)
      }
      const reloadUrl = __RELOAD__
      if (reloadUrl && parent === window) {
        let loaded, failed = false
        new EventSource(reloadUrl).addEventListener("message", (message) => {
          const event = JSON.parse(message.data)
          if (event.type === "error") {
            failed = true
            showError(event.message)
          }
          if (event.type !== "built") return
          if (failed || (loaded !== undefined && event.id !== loaded)) location.reload()
          loaded ??= event.id
        })
      }
      const url = "/mygo/" + wasm
      const host = (() => {
        try {
          return !dev && parent !== window && parent.location.origin === location.origin ? parent : null
        } catch {
          return null
        }
      })()
      // Compiled in the docs page's realm so every demo frame, including those mounted after a
      // client-side navigation, instantiates one shared module instead of compiling 20 MB each;
      // a fetch started in this frame would also be aborted when the frame unmounts mid-compile.
      const shared = () => {
        const cache = (host.__mygoModules ??= {})
        cache[wasm] ??= host.WebAssembly.compileStreaming(host.fetch(url)).catch((e) => {
          delete cache[wasm]
          throw e
        })
        return cache[wasm].then((module) => WebAssembly.instantiate(module, go.importObject))
      }
      const local = () =>
        WebAssembly.instantiateStreaming(fetch(url, dev ? { cache: "no-store" } : {}), go.importObject).then((r) => r.instance)
      ;(host ? shared().catch(local) : local())
        .then((instance) => go.run(instance))
        .then(() => showError(`The demo "${demo}" stopped. The browser console has the reason.`))
        .catch((e) => showError("The preview did not load: " + e))
    </script>
  </body>
</html>
